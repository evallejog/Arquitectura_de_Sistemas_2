<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Login | Tienda Genérica</title><link rel="stylesheet" href="/css/style.css"></head><body class="login-body"><main class="login-card"><h1>Tienda Genérica</h1><p>Ingreso al sistema</p><div class="alert error" th:if="${param.error}">Usuario o contraseña errados, intente de nuevo</div><div class="alert ok" th:if="${param.logout}">Sesión cerrada correctamente</div><form method="post" action="/login"><label>Usuario</label><input name="usuario" required autofocus><label>Contraseña</label><input type="password" name="contrasena" required><button type="submit">Ingresar</button></form><small>Usuario inicial: admininicial</small></main></body></html>
