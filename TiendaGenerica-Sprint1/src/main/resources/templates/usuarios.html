<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Gestión de Usuarios</title><link rel="stylesheet" href="/css/style.css"></head><body><header><h1>Tienda Genérica</h1><nav><b>Gestión de Usuarios</b><a href="/logout">Cerrar sesión</a></nav></header><main class="container"><h2>Administración de usuarios</h2><div class="alert ok" th:if="${ok}" th:text="${ok}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><form id="userForm" th:object="${usuario}"><div class="grid"><div><label>Cédula</label><input id="cedula" th:field="*{cedula}" required></div><div><label>Nombre completo</label><input th:field="*{nombreCompleto}" required></div><div><label>Correo electrónico</label><input type="email" th:field="*{correo}" required></div><div><label>Usuario</label><input th:field="*{usuario}" required></div><div><label>Contraseña</label><input type="password" th:field="*{contrasena}" required></div></div><div class="actions"><button formaction="/usuarios/crear" formmethod="post">Crear</button><button formaction="/usuarios/actualizar" formmethod="post">Actualizar</button><button formaction="/usuarios/borrar" formmethod="post" formnovalidate>Eliminar</button><button type="button" onclick="consultar()">Consultar</button><button type="reset">Limpiar</button></div></form></main><script>function consultar(){let c=document.getElementById('cedula').value.trim();if(!c){alert('Cédula Errada');return;}location='/usuarios/consultar?cedula='+encodeURIComponent(c);}</script></body></html>
